[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "lab-data-analyzer"
version = "0.1.0"
description = "A scientific CSV analysis app for chromatography and spectroscopy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "plotly>=5.18", "streamlit>=1.30"]
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.setuptools.packages.find]
include = ["lab_analyzer*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
